[package]
name = "tensor-operations"
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
description = "Week 13: Matrix and Tensor Operations in Rust - Manual vs Optimized"
license = "MIT"

[dependencies]
nalgebra = "0.32"
ndarray = "0.15"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "matrix_benchmarks"
harness = false

[lib]
name = "tensor_operations"
path = "src/lib.rs"

[[example]]
name = "basic_operations"
path = "examples/basic_operations.rs"

[[example]]
name = "performance_comparison"
path = "examples/performance_comparison.rs"

[[example]]
name = "advanced_operations"
path = "examples/advanced_operations.rs"

[profile.release]
opt-level = 3
lto = true

[profile.bench]
opt-level = 3
